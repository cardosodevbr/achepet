        <!-- HERO -->
        <section class="hero" id="mural">
            <div class="hero-container">
                <div class="hero-content">
                    <h1>
                        Encontre seu <span class="logo-pet">pet.</span>
                        <img src="media/coracao-rosa.png" id="coracao" alt="Coração rosa decorativo">
                    </h1>

                    <p>
                        O AchePet conecta pessoas que perderam seus animais com quem pode ajudar a encontrá-los.
                    </p>

                    <!-- UX CORRIGIDA: Ações separadas da barra de busca -->
                    <div class="hero-actions">
                        <a href="form1.html#perdi" class="btn-action btn-lost" id="btnPerdi">PERDI UM PET</a>
                        <a href="form1.html#encontrei" class="btn-action btn-found" id="btnEncontrei">ENCONTREI UM PET</a>
                    </div>

                    <div class="search-box">
                        <div class="search-input">
                            <span class="search-icon" aria-hidden="true">⌖</span>
                            <input type="text" id="cidadeBusca" placeholder="Busque por cidade (Ex: São Paulo)" autocomplete="off">
                            <button class="btn-search">BUSCAR</button>
                        </div>
                    </div>
                </div>
                
                <div class="hero-image-wrapper">
                    <img src="media/telainicial-animais-remove.png" id="cachorro" alt="Cachorro sorridente olhando para o ecrã">
                </div>
            </div>
        </section>

        <!-- ANIMAIS PERDIDOS (Carregado dinamicamente via JS/Supabase) -->
        <section class="pets-section lost-section" id="animais-perdidos">
            <div class="section-container">
                <div class="section-title lost-title">
                    <h2>Animais Perdidos</h2>
                    <p>Últimos pets anunciados</p>
                </div>

                <!-- Aviso de Carregamento -->
                <div id="loadingPerdidos" style="text-align: center; color: var(--rosa-principal); font-weight: 600; margin-bottom: 20px;">
                    A carregar os anúncios mais recentes... 🐾
                </div>

                <!-- GRID FLUIDO APLICADO VIA CSS -->
                <div class="pets-grid" id="ultimosPerdidosGrid">
                    <!-- Os cartões serão injetados aqui pelo script.js -->
                </div>

                <!-- Mensagem caso não haja animais perdidos -->
                <div id="emptyPerdidos" style="text-align: center; color: var(--cinza-texto); display: none; padding: 20px 0;">
                    Felizmente, não há registos recentes de animais perdidos.
                </div>

                <div class="ver-mais-wrapper">
                    <!-- Direciona para o mural unificado -->
                    <a href="mural.html" class="btn-ver-mais btn-lost-outline">VER MAIS</a>
                </div>
            </div>
        </section>
