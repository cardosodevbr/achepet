<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CONEXÃO COM O SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <!-- PROTEÇÃO DE ROTA (Apenas logados entram) -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof clienteSupabase === 'undefined') return;
            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (!session) {
                alert("⚠️ Acesso restrito. Faça login para anunciar um animal.");
                window.location.replace('login.html');
            }
        });
    </script>

    <title>Cadastrar Animal | AchePet 🐾</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .container {
            width: 92%;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
        }

        .form-grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 600px) {
            .form-grid-2-col { grid-template-columns: 1fr; }
        }

        .status-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status-radio {
            display: none;
        }
        
        .status-label {
            flex: 1;
            text-align: center;
            padding: 15px;
            border: 2px solid var(--cinza);
            border-radius: 12px;
            cursor: pointer;
            font-family: var(--fonte-poppins);
            font-weight: 600;
            color: var(--cinza-texto);
            transition: all 0.3s ease;
        }

        #status_perdido:checked + .status-label {
            border-color: var(--rosa-principal);
            background: var(--rosa-claro);
            color: var(--rosa-principal);
        }

        #status_encontrado:checked + .status-label {
            border-color: var(--azul-principal);
            background: var(--azul-claro);
            color: var(--azul-principal);
        }

        .ux-dica-box {
            margin-top: 15px; padding: 15px; border-radius: 10px; font-size: 13px;
            display: flex; gap: 10px; align-items: flex-start; line-height: 1.5;
            background: #f8fafc; border-left: 4px solid #cbd5e1; color: var(--cinza-texto);
            transition: all 0.3s ease;
        }
        
        .ux-dica-icon { font-size: 20px; }

        html[data-tema="escuro"] .ux-dica-box {
            background: #1e2c42; border-left-color: #475569; color: #d5dfec;
        }

        textarea {
            width: 100%; min-height: 100px; padding: 12px 16px; border: 2px solid var(--azul-claro);
            border-radius: 12px; font-family: var(--fonte-open-sans); resize: vertical;
        }
        
        html[data-tema="escuro"] textarea {
            background: var(--fundo-card); color: var(--preto); border-color: #1e2c42;
        }

        /* --- ESTILOS DA NOVA LISTA SUSPENSA CUSTOMIZADA --- */
        .custom-autocomplete { position: relative; }
        
        .autocomplete-list {
            position: absolute; top: calc(100% - 10px); left: 0; right: 0;
            background: var(--fundo-card);
            border: 2px solid var(--azul-claro); 
            border-top: none;
            border-radius: 0 0 12px 12px;
            max-height: 200px; 
            overflow-y: auto; 
            z-index: 1000;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            display: none; /* Escondido por defeito */
        }
        
        .autocomplete-item {
            padding: 12px 16px; 
            cursor: pointer; 
            color: var(--preto);
            font-family: var(--fonte-open-sans); 
            font-size: 14px;
            transition: 0.2s ease;
            border-bottom: 1px solid #f1f5f9;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        
        .autocomplete-item:hover { 
            background: var(--azul-claro); 
            color: var(--azul-principal); 
            padding-left: 20px; /* Pequeno efeito de movimento ao passar o rato */
        }
        
        html[data-tema="escuro"] .autocomplete-list { 
            background: var(--fundo-card); border-color: #1e2c42; 
        }
        html[data-tema="escuro"] .autocomplete-item { border-bottom-color: #2a3b52; }
        html[data-tema="escuro"] .autocomplete-item:hover { 
            background: #1e2c42; color: #6cc0f5; 
        }

        /* --- PREVIEW DA FOTO --- */
        .preview-container {
            width: 100%; height: 250px; border: 2px dashed var(--azul-claro);
            border-radius: 12px; margin-top: 10px; display: none; 
            align-items: center; justify-content: center; overflow: hidden;
            background: #f8fafc; position: relative;
        }
        .preview-container img { width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        .btn-remover-foto {
            position: absolute; top: 10px; right: 10px; background: rgba(233, 22, 107, 0.9);
            color: white; border: none; width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; z-index: 2; font-weight: bold; display: flex;
            align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        html[data-tema="escuro"] .preview-container { background: #1e2c42; border-color: #475569; }
    </style>
</head>

<body data-page="cadastro-animal">

    <div id="header-placeholder"></div>

    <main class="login-main" style="align-items: flex-start; padding-top: 40px;">
        <section class="cadastro-section container">
            <div class="cadastro-container" style="padding: 40px; margin-top: 0;">
                
                <div class="cadastro-title" style="text-align: center; margin-bottom: 30px;">
                    <h1 style="color: var(--azul-escuro); margin-bottom: 10px;">Cadastrar Animal</h1>
                    <p style="color: var(--cinza-texto);">Preencha as informações para publicar no mural.</p>
                </div>

                <form id="animalForm" class="auth-form" onsubmit="event.preventDefault(); salvarAnimal();">
                    
                    <!-- 1. DEFINIÇÃO DO STATUS -->
                    <div class="form-group">
                        <label>O que aconteceu?</label>
                        <div class="status-selector">
                            <input type="radio" name="status_pet" id="status_perdido" class="status-radio" value="perdido" checked>
                            <label for="status_perdido" class="status-label">🐾 Perdi o meu pet</label>
                            
                            <input type="radio" name="status_pet" id="status_encontrado" class="status-radio" value="achado_na_rua">
                            <label for="status_encontrado" class="status-label">👀 Achei um pet na rua</label>
                        </div>
                        
                        <div class="ux-dica-box" id="dicaStatus">
                            <span class="ux-dica-icon">💡</span>
                            <div>
                                Antes de cadastrar, acesse o <a href="mural.html" style="color: var(--azul-principal);">Mural</a>. Alguém já pode ter achado o seu pet! 
                            </div>
                        </div>
                    </div>

                    <!-- 2. INFORMAÇÕES BÁSICAS -->
                    <div class="form-grid-2-col">
                        <div class="form-group">
                            <label for="nome_pet">Nome do Animal</label>
                            <input type="text" id="nome_pet" placeholder="Ex: Isac (ou 'Desconhecido')" required>
                        </div>
                        
                        <!-- NOVA ESPÉCIE CUSTOMIZADA COM DROPDOWN -->
                        <div class="form-group custom-autocomplete">
                            <label for="especie_pet">Espécie</label>
                            <input type="text" id="especie_pet" placeholder="Selecione ou digite a espécie..." required autocomplete="off" style="width: 100%; height: 46px; border: 2px solid var(--azul-claro); border-radius: 12px; padding: 0 16px; outline: none; font-family: var(--fonte-open-sans); position: relative; z-index: 1001;">
                            
                            <!-- Lista Suspensa gerada via JavaScript -->
                            <div id="lista_especies_custom" class="autocomplete-list"></div>
                        </div>
                    </div>

                    <!-- 3. LOCALIZAÇÃO E DATA -->
                    <div class="form-grid-2-col">
                        <div class="form-group">
                            <label for="cidade_pet">Cidade e Estado</label>
                            <input type="text" id="cidade_pet" placeholder="Ex: São Paulo, SP" required>
                        </div>
                        <div class="form-group">
                            <label for="data_pet">Data do Ocorrido</label>
                            <input type="date" id="data_pet" required>
                        </div>
                    </div>

                    <!-- 4. DESCRIÇÃO E FOTO -->
                    <div class="form-group">
                        <label for="descricao_pet">Descrição / Detalhes</label>
                        <textarea id="descricao_pet" placeholder="Descreva a cor, tamanho, coleira ou características marcantes..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="foto_pet">Fotografia (Obrigatório)</label>
                        <input type="file" id="foto_pet" accept="image/*" style="padding-top: 10px; border: none; background: transparent;">
                        
                        <!-- Contentor do Preview -->
                        <div class="preview-container" id="previewBox">
                            <button type="button" class="btn-remover-foto" id="btnRemoverFoto" title="Remover foto">X</button>
                            <img id="imagemPreview" src="" alt="Preview da foto">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-auth" id="btnSalvarAnimal" style="margin-top: 20px;">PUBLICAR NO MURAL</button>
                </form>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    
    <script>
        // --- LÓGICA DE UX PARA A CAIXA DE DICAS ---
        const radioPerdido = document.getElementById('status_perdido');
        const radioEncontrado = document.getElementById('status_encontrado');
        const dicaBox = document.getElementById('dicaStatus');

        const textoPerdido = `
            <span class="ux-dica-icon">💡</span>
            <div>
                Antes de cadastrar, acesse o <a href="mural.html" style="color: var(--azul-principal);">Mural</a>. Alguém já pode ter achado o seu pet!
            </div>
        `;
        const textoEncontrado = `
            <span class="ux-dica-icon">💡</span>
            <div>
                Antes de cadastrar, acesse o <a href="mural.html" style="color: var(--rosa-principal);">Mural</a>. O tutor dele pode estar a procurar por ele lá!
            </div>
        `;

        radioPerdido.addEventListener('change', () => {
            if(radioPerdido.checked) {
                dicaBox.innerHTML = textoPerdido;
                dicaBox.style.borderLeftColor = 'var(--rosa-principal)';
            }
        });

        radioEncontrado.addEventListener('change', () => {
            if(radioEncontrado.checked) {
                dicaBox.innerHTML = textoEncontrado;
                dicaBox.style.borderLeftColor = 'var(--azul-principal)';
            }
        });
        dicaBox.style.borderLeftColor = 'var(--rosa-principal)';


        // --- LÓGICA DA LISTA SUSPENSA DE ESPÉCIES (DROPDOWN INTELIGENTE) ---
        const especiesSugeridas = [
            "Cachorro", "Gato", "Coelho", "Calopsita", "Papagaio", 
            "Pássaro (Outro)", "Tartaruga", "Hamster", "Porquinho-da-índia", "Cavalo"
        ];
        
        const inputEspecie = document.getElementById('especie_pet');
        const listaEspeciesCustom = document.getElementById('lista_especies_custom');

        // Função que desenha a lista com base no que a pessoa digitou
        function renderizarListaEspecies(filtro = '') {
            listaEspeciesCustom.innerHTML = ''; // Limpa a lista anterior
            const termo = filtro.toLowerCase().trim();
            
            // Filtra as sugestões que contenham o que foi digitado
            const filtradas = especiesSugeridas.filter(esp => esp.toLowerCase().includes(termo));
            
            // Se não houver correspondência, esconde a lista (mas deixa a pessoa escrever à vontade)
            if (filtradas.length === 0) {
                listaEspeciesCustom.style.display = 'none';
                return;
            }

            // Cria os elementos visuais na lista suspensa
            filtradas.forEach(esp => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.textContent = esp;
                
                // Ao clicar numa sugestão, preenche o input e fecha a lista
                div.onmousedown = function() { // onmousedown previne conflito com o onblur do input
                    inputEspecie.value = esp;
                    listaEspeciesCustom.style.display = 'none';
                };
                
                listaEspeciesCustom.appendChild(div);
            });
            
            listaEspeciesCustom.style.display = 'block';
        }

        // Eventos do input de espécie
        inputEspecie.addEventListener('focus', () => renderizarListaEspecies(inputEspecie.value));
        inputEspecie.addEventListener('input', (e) => renderizarListaEspecies(e.target.value));
        inputEspecie.addEventListener('blur', () => {
            // Pequeno atraso para dar tempo do clique no item da lista ser registado
            setTimeout(() => { listaEspeciesCustom.style.display = 'none'; }, 150);
        });


        // --- LÓGICA DE PREVIEW DA FOTOGRAFIA ---
        const inputFoto = document.getElementById('foto_pet');
        const previewBox = document.getElementById('previewBox');
        const imagemPreview = document.getElementById('imagemPreview');
        const btnRemoverFoto = document.getElementById('btnRemoverFoto');

        inputFoto.addEventListener('change', function(event) {
            const ficheiro = event.target.files[0];
            if (ficheiro) {
                const leitor = new FileReader();
                leitor.onload = function(e) {
                    imagemPreview.src = e.target.result;
                    previewBox.style.display = 'flex'; 
                }
                leitor.readAsDataURL(ficheiro);
            } else {
                limparPreview();
            }
        });

        btnRemoverFoto.addEventListener('click', limparPreview);

        function limparPreview() {
            inputFoto.value = ''; 
            imagemPreview.src = '';
            previewBox.style.display = 'none'; 
        }


        // --- LÓGICA DE BANCO DE DADOS (SUPABASE) ---
        async function salvarAnimal() {
            const btnSalvar = document.getElementById('btnSalvarAnimal');
            btnSalvar.innerText = "A PUBLICAR...";
            btnSalvar.disabled = true;

            try {
                // 1. VERIFICA SESSÃO
                const { data: { session }, error: authError } = await clienteSupabase.auth.getSession();
                if (authError || !session) {
                    alert("A sessão expirou. Faça login novamente.");
                    window.location.href = "login.html";
                    return;
                }

                // 2. CAPTURA DADOS DO FORMULÁRIO
                const status = document.querySelector('input[name="status_pet"]:checked').value;
                const nome = document.getElementById('nome_pet').value.trim();
                const especie = document.getElementById('especie_pet').value.trim();
                const cidade = document.getElementById('cidade_pet').value.trim();
                const dataOcorrido = document.getElementById('data_pet').value;
                const descricao = document.getElementById('descricao_pet').value.trim();
                const fotoInput = document.getElementById('foto_pet');

                // Validação extra garantindo que a espécie foi preenchida
                if (!especie) {
                    throw new Error("Por favor, informe a espécie do animal.");
                }

                if (fotoInput.files.length === 0) {
                    throw new Error("Por favor, anexe uma fotografia do animal.");
                }

                const arquivoFoto = fotoInput.files[0];
                const extensao = arquivoFoto.name.split('.').pop();
                const nomeArquivo = `${Date.now()}_${Math.floor(Math.random() * 1000)}.${extensao}`;
                const caminhoStorage = `${session.user.id}/${nomeArquivo}`;

                // 3. UPLOAD DA FOTO PARA O STORAGE
                const { data: uploadData, error: uploadError } = await clienteSupabase.storage
                    .from('fotos_pets') 
                    .upload(caminhoStorage, arquivoFoto);

                if (uploadError) {
                    throw new Error("Falha ao fazer upload da imagem: " + uploadError.message);
                }

                // 4. OBTER A URL PÚBLICA DA FOTO
                const { data: publicUrlData } = clienteSupabase.storage
                    .from('fotos_pets')
                    .getPublicUrl(caminhoStorage);

                const urlDaFoto = publicUrlData.publicUrl;

                // 5. INSERIR DADOS NA TABELA (Agora incluindo os dados do tutor!)
                const novoAnimal = {
                    user_id: session.user.id,
                    tutor_nome: session.user.user_metadata?.display_name || 'Tutor não identificado',
                    tutor_telefone: session.user.user_metadata?.whatsapp || '',
                    tutor_foto: session.user.user_metadata?.foto_url || '',
                    status: status,
                    nome: nome,
                    especie: especie,
                    cidade: cidade,
                    data_evento: dataOcorrido,
                    descricao: descricao,
                    foto_url: urlDaFoto,
                    ativo: true
                };
                
                const { error: insertError } = await clienteSupabase
                    .from('animais')
                    .insert([novoAnimal]);

                if (insertError) {
                    throw new Error("Erro ao salvar os dados no banco: " + insertError.message);
                }

                // 6. SUCESSO E REDIRECIONAMENTO
                btnSalvar.innerText = "PUBLICAR NO MURAL";
                btnSalvar.disabled = false;
                alert(`✅ Animal cadastrado com sucesso!`);
                
                window.location.href = "mural.html";

            } catch (error) {
                console.error("Erro na operação:", error);
                alert("❌ Ocorreu um erro: " + error.message);
                btnSalvar.innerText = "PUBLICAR NO MURAL";
                btnSalvar.disabled = false;
            }
        }
    </script>

</body>
</html>
