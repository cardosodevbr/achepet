<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Mural Unificado | AchePet 🐾</title>

    <!-- CONEXÃO COM O SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <link rel="stylesheet" href="style.css">
    
    <style>
        .mural-hero { min-height: auto; padding: 40px 0 60px; background: var(--fundo-azul); transition: background 0.3s ease;}
        html[data-tema="escuro"] .mural-hero { background: #101d2e; }
        .mural-header-content { text-align: center; max-width: 600px; margin: 0 auto 30px; }
        .mural-header-content h1 { color: var(--azul-escuro); font-size: 36px; transition: color 0.3s ease; }
        html[data-tema="escuro"] .mural-header-content h1 { color: #6cc0f5; }
        .search-buttons { display: flex; gap: 10px; }
        .filtros-panel { background: var(--fundo-card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 auto 40px; max-width: 900px; border: 1px solid var(--azul-claro); }
        html[data-tema="escuro"] .filtros-panel { background: #1e2c42; border-color: #2a3b52; }
        .filtros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .filtro-grupo legend { font-family: var(--fonte-poppins); font-weight: 600; color: var(--azul-escuro); margin-bottom: 10px; font-size: 14px; }
        html[data-tema="escuro"] .filtro-grupo legend { color: #d5dfec; }
        .filtro-grupo label { display: block; margin-bottom: 5px; font-size: 13px; color: var(--cinza-texto); cursor: pointer; }
        .filtro-acoes { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>

<body data-page="mural">

    <div id="header-placeholder"></div>

    <main>
        <!-- TOPO DO MURAL -->
        <section class="mural-hero" id="muralHeroSection">
            <div class="section-container">
                
                <div class="mural-header-content">
                    <h1 id="muralTitle">Mural de Pets <img src="media/coracao-rosa.png" style="width: 30px; vertical-align: middle;"></h1>
                    <p id="muralSubtitle" style="color: var(--cinza-texto); margin-top: 10px;">Encontre, ajude e celebre os reencontros na sua região.</p>
                </div>

                <!-- BUSCA -->
                <div class="search-box" style="max-width: 900px; margin: 0 auto;">
                    <div class="search-input">
                        <span class="search-icon">⌖</span>
                        <input type="text" id="cidadeBusca" placeholder="Busque por cidade (Ex: São Paulo)" autocomplete="off">
                        <div class="search-buttons">
                            <button type="button" class="btn-lost" id="btnFiltros" style="border: none; background: transparent; font-size: 12px; text-decoration: underline;">+ Filtros</button>
                            <button type="button" class="btn-search" id="btnBuscar">BUSCAR</button>
                        </div>
                    </div>
                </div>

                <!-- FILTROS EXTRAS -->
                <div class="filtros-panel" id="filtrosPanel" style="display: none; margin-top: 20px;">
                    <div class="filtros-grid">
                        <fieldset class="filtro-grupo" style="border: none;">
                            <legend>Espécie</legend>
                            <label><input type="radio" name="especie" value="todos" checked> Todos</label>
                            <label><input type="radio" name="especie" value="Cachorro"> Cachorro</label>
                            <label><input type="radio" name="especie" value="Gato"> Gato</label>
                            <label><input type="radio" name="especie" value="Outro"> Outro</label>
                        </fieldset>
                    </div>
                    <div class="filtro-acoes">
                        <button type="button" class="btn-logout-clean" id="btnLimparFiltros">Limpar</button>
                        <button type="button" class="btn-search" id="btnAplicarFiltros" style="padding: 6px 15px; font-size: 12px;">Aplicar</button>
                    </div>
                </div>

            </div>
        </section>

        <!-- SECÇÃO DE RESULTADOS -->
        <section class="pets-section" style="padding-top: 0;">
            <div class="section-container">
                
                <!-- AS NOVAS ABAS (TABS) DE NAVEGAÇÃO -->
                <div class="mural-tabs">
                    <button class="mural-tab active" data-target="todos">Todos</button>
                    <button class="mural-tab" data-target="perdido">Animais Perdidos</button>
                    <button class="mural-tab" data-target="achado_na_rua">Animais Encontrados</button>
                    <button class="mural-tab" data-target="final_feliz">Finais Felizes 💖</button>
                </div>

                <!-- Status de carregamento -->
                <div id="loadingMessage" style="text-align: center; color: var(--azul-escuro); font-weight: 600; margin-bottom: 20px;">
                    A carregar mural... 🐾
                </div>

                <!-- Grelha de Cartões -->
                <div class="pets-grid" id="petsGrid"></div>
                
                <!-- Mensagem Vazia -->
                <div id="emptyMessage" style="text-align: center; color: var(--cinza-texto); display: none; padding: 40px 0;">
                    Nenhum animal nesta categoria com os filtros selecionados.
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="script.js"></script>

    <script>
    // 1. Variável de Estado Global - Agora começa em "todos"
    let statusAtual = 'todos';

    // 2. Lógica das Abas (Tabs)
    const tabs = document.querySelectorAll('.mural-tab');
    const heroSection = document.getElementById('muralHeroSection');
    const title = document.getElementById('muralTitle');

    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            tabs.forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            statusAtual = e.target.getAttribute('data-target');
            
            // Muda as cores do topo dependendo da aba
            if(statusAtual === 'perdido') {
                heroSection.style.background = 'var(--fundo-rosa)';
                title.innerHTML = 'Animais Perdidos <img src="media/coracao-rosa.png" style="width: 30px; vertical-align: middle;">';
            } else if (statusAtual === 'achado_na_rua') {
                heroSection.style.background = 'var(--fundo-azul)';
                title.innerHTML = 'Animais Encontrados <img src="media/coracao-rosa.png" style="width: 30px; vertical-align: middle;">';
            } else if (statusAtual === 'final_feliz') {
                heroSection.style.background = '#ECFDF5'; 
                title.innerHTML = 'Finais Felizes 💖';
            } else {
                heroSection.style.background = 'var(--fundo-azul)';
                title.innerHTML = 'Mural de Pets <img src="media/coracao-rosa.png" style="width: 30px; vertical-align: middle;">';
            }
            
            buscarAnimais();
        });
    });

    // 3. Toggle de Filtros
    document.getElementById('btnFiltros').addEventListener('click', () => {
        const panel = document.getElementById('filtrosPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    function formatarData(dataIso) {
        if(!dataIso) return "Data desconhecida";
        const partes = dataIso.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    // --- NOVA LÓGICA: CAPTURA A BUSCA DO INDEX E LIMPA A URL ---
    function lerFiltroDaURL() {
        const urlParams = new URLSearchParams(window.location.search);
        const cidadeUrl = urlParams.get('cidade');
        
        if (cidadeUrl) {
            const campoBusca = document.getElementById('cidadeBusca');
            if (campoBusca) {
                // Preenche o input do mural com a palavra recebida
                campoBusca.value = cidadeUrl; 
            }
            // Limpa a URL para que, se o utilizador atualizar a página depois de limpar a busca, ela não volte a "puxar" a cidade antiga
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    }

    // 4. Busca principal no Supabase
    async function buscarAnimais() {
        const grid = document.getElementById('petsGrid');
        const loading = document.getElementById('loadingMessage');
        const emptyMsg = document.getElementById('emptyMessage');
        
        // Pega o texto digitado
        const cidadeFiltro = document.getElementById('cidadeBusca').value.trim();
        
        // LIMPEZA: Remove acentos e converte para minúsculas (Ex: "São Paulo" -> "sao paulo")
        const cidadeNormalizada = cidadeFiltro.normalize('NFD').replace(/[\u0300-\u036f]/g, "").toLowerCase();

        const especieFiltro = document.querySelector('input[name="especie"]:checked')?.value;

        loading.style.display = 'block';
        grid.innerHTML = '';
        emptyMsg.style.display = 'none';

        try {
            let query = clienteSupabase
                .from('animais')
                .select('*')
                .eq('ativo', true)
                .order('created_at', { ascending: false });

            // Só filtra o status se a aba não for "Todos"
            if (statusAtual !== 'todos') {
                query = query.eq('status', statusAtual);
            }

            // Usa a coluna invisível do banco de dados para buscar sem acentos
            if (cidadeNormalizada) {
                query = query.ilike('cidade_busca', `%${cidadeNormalizada}%`);
            }
            
            if (especieFiltro && especieFiltro !== 'todos') {
                query = query.eq('especie', especieFiltro);
            }

            const { data: animais, error } = await query;
            if (error) throw error;

            loading.style.display = 'none';

            if (animais.length === 0) {
                emptyMsg.style.display = 'block';
                return;
            }

            animais.forEach(animal => {
                const fotoUrl = animal.foto_url || 'media/placeholder-pet.png';
                
                animais.forEach(animal => {
                grid.innerHTML += gerarCardAnimal(animal);
            });
            });

        } catch (err) {
            console.error("Erro:", err);
            loading.innerText = "❌ Ocorreu um erro ao carregar o mural.";
        }
    }

    // 5. Botões e Ações Iniciais
    document.getElementById('btnBuscar').addEventListener('click', buscarAnimais);
    document.getElementById('btnAplicarFiltros').addEventListener('click', buscarAnimais);
    
    document.getElementById('btnLimparFiltros').addEventListener('click', () => {
        document.getElementById('cidadeBusca').value = '';
        
        const radios = document.querySelectorAll('input[name="especie"]');
        radios.forEach(r => {
            if(r.value === 'todos') r.checked = true;
        });
        
        buscarAnimais();
    });

    // Executa a primeira busca ao abrir a página
    document.addEventListener('DOMContentLoaded', () => {
        // Primeiro lemos a URL, depois iniciamos a busca
        lerFiltroDaURL();
        buscarAnimais();
    });
</script>
</body>
</html>
