<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FONTES OTIMIZADAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CONEXÃO COM O BANCO DE DADOS (SUPABASE) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <title>Cadastro | AchePet 🐾</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="cadastro">

    <!-- COMPONENTES DINÂMICOS -->
    <div id="header-placeholder"></div>

    <!-- ÁREA DO CADASTRO (Reaproveitando o grid do Login) -->
    <main class="login-main">
        <section class="cadastro-section">
            <div class="cadastro-container login-container">
                
                <div class="login-grid">
                    
                    <!-- LADO ESQUERDO: Formulário -->
                    <div class="login-form-area">
                        <h1>Crie a sua conta</h1>
                        <p>Encontre, ajude e faça parte do AchePet.</p>
                        
                        <!-- UX: Formulário semântico previne recarregamento da página ao disparar o JS -->
                        <form id="cadastroForm" class="auth-form" onsubmit="event.preventDefault(); registrar();">
                            
                            <div class="form-group">
                                <label for="nome">Nome completo</label>
                                <input type="text" id="nome" placeholder="Digite o seu nome completo" required>
                            </div>

                            <div class="form-group">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" placeholder="Digite o seu e-mail" autocomplete="email" required>
                            </div>

                            <!-- Campos comentados preservados -->
                            <!--
                            <div class="form-group">
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label for="cidade">Cidade</label>
                                <input type="text" id="cidade" placeholder="Digite a sua cidade">
                            </div>
                            -->

                            <div class="form-group">
                                <label for="senha">Senha</label>
                                <input type="password" id="senha" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" required>
                            </div>

                            <div class="form-group">
                                <label for="confirmar-senha">Confirmar senha</label>
                                <input type="password" id="confirmar-senha" placeholder="Digite a sua senha novamente" autocomplete="new-password" minlength="8" required>
                            </div>
                            
                            <button type="submit" class="btn-auth" id="btnRegistrar">REGISTRAR-SE</button>
                        </form>
                        
                        <div class="auth-links">
                            <a href="login.html">Já tem uma conta? Entrar</a>
                        </div>
                    </div>

                    <!-- LADO DIREITO: Imagem padronizada -->
                    <div class="login-image-area">
                        <!-- Podem usar outra imagem específica de cadastro aqui se preferirem -->
                        <img src="media/papagaio.jpeg" alt="Mascote Papagaio do AchePet">
                    </div>

                </div>

            </div>
        </section>
    </main>

    <!-- COMPONENTES DINÂMICOS -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="script.js"></script>
    
    <!-- LÓGICA DE CADASTRO DO SUPABASE PRESERVADA -->
    <script>
        async function registrar() {
            // 1. Captura os valores digitados
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;
            const btnRegistrar = document.getElementById('btnRegistrar');

            // 2. Validações locais adicionais
            if (senha !== confirmarSenha) {
                return alert("⚠️ As senhas não coincidem. Digite novamente.");
            }

            // 3. Feedback visual
            btnRegistrar.innerText = "Processando...";
            btnRegistrar.disabled = true;

            // 4. Integração com Supabase
            const { data, error } = await clienteSupabase.auth.signUp({
                email: email,
                password: senha,
                options: {
                    data: {
                        display_name: nome,
                        full_name: nome 
                    }
                }
            });

            // 5. Restaura o botão
            btnRegistrar.innerText = "REGISTRAR-SE";
            btnRegistrar.disabled = false;

            // 6. Tratamento de Sucesso ou Erro
            if (error) {
                alert("❌ Erro ao cadastrar: " + error.message);
            } else {
                alert("✅ Conta criada com sucesso! Bem-vindo(a) ao AchePet.");
                window.location.replace('index.html'); 
            }
        }
    </script>

</body>
</html>
